name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json (single source of truth).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check & build
        run: pnpm run build

      # Both smoke tests are CI-safe: test:lib uses a mock provider and test:mcp relies on
      # the server's missing-key fallback (read-only tools only), so neither makes an API
      # call or needs a secret. They also exercise the native better-sqlite3 load on each OS.
      - name: Library + provider-plugin smoke test
        run: pnpm test:lib

      - name: MCP server smoke test
        run: pnpm test:mcp
